    <!--
      IMPECCABLE DIRECTION CONTRACT — seed 635cb4be · operate · grounded #4

      THESIS: Markivo is a workroom, not a analytics dashboard. It refuses the
      SaaS-app arrangement it used to be — glass cards, blurred colour blobs,
      gradient buttons, a hero row of vanity metrics — and it refuses that
      arrangement's predictable opposite, the neutral Swiss admin panel. The
      queue is the product; the numbers sit under it.

      OWN-WORLD: Uzbek ikat and suzani as an interface grammar. Saturated flat
      fields on an indigo (dark) or raw-silk (light) ground; four named dye
      roles — madder, jade, saffron, pomegranate. Square corners, no drop
      shadows, no glass: structure is made of seams. Regions are stitched
      panels with a visible stitch rule, the shell is a bolt of cloth with a
      left selvedge. Golos Text and Martian Mono, both Cyrillic-native.

      STORY: The operator sees which channels are live, what is queued for
      today, and what failed — in that order — then refills the queue without
      leaving the field.

      FIRST VIEWPORT: A full-width warp band of channel stripes across the top
      of the field, one saturated stripe per channel, hard-edged when live and
      frayed when simulated. Directly beneath it, seamed to it, today's queue
      as timed rows. Metrics are below the fold of that pairing. Primary action
      ("Compose") sits at the right end of the warp band.

      FORM: Ikat & suzani panel system — candidate 4 of the grounded list,
      assigned by seed 635cb4be. Staging: the dealt object-time fan, committed
      on the generation surfaces only (pull a generated post sideways to fan
      its discarded variants and lift one forward).

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
