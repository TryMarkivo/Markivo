server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. proxy_pass through a variable defers hostname
    # resolution to request time, so nginx still starts if the backend
    # container is down or this image runs outside docker compose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:5000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback — all routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API proxy to the backend container.
    location /api/ {
        # Media uploads arrive as base64 JSON (backend accepts up to 12mb).
        client_max_body_size 15m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_pass $api_upstream;
    }

    # Uploaded media — the backend returns relative /uploads/<file> URLs,
    # so the frontend origin must serve them.
    location /uploads/ {
        proxy_set_header Host $host;
        proxy_pass $api_upstream;
    }
}
