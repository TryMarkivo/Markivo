# Production overlay — adds Caddy (automatic HTTPS for trymarkivo.com) in front
# of the frontend nginx container. Deploy with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # persisted certs — survives restarts
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Caddy is the only public entrypoint now; the frontend is reached over the
  # internal compose network, so it no longer needs to publish a host port.
  frontend:
    ports: []

volumes:
  caddy-data:
  caddy-config:
